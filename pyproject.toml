[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rutune"
version = "0.1.0"
description = "Reference-guided singing voice processing (MVP DSP engine)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "pyworld>=0.3.4",
    "pyloudnorm>=0.1.1",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "typer>=0.12",
]

[project.optional-dependencies]
crepe = ["torchcrepe>=0.0.23"]
rubberband = ["pyrubberband>=0.4"]
speaker = ["speechbrain>=1.0", "torchaudio>=2.2"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
rutune = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: typer.Option defaults are the idiomatic typer API.
# RUF046: int(round(x)) is intentional — x is often a numpy float.
ignore = ["B008", "RUF046"]
